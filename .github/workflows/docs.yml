name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[docs]"

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages --depth=1 || true

      - name: Generate llms-full.txt
        run: |
          python -c "
          import yaml, os

          with open('mkdocs.yml') as f:
              nav = yaml.safe_load(f)['nav']

          def collect_paths(items):
              paths = []
              for item in items:
                  if isinstance(item, str):
                      paths.append(item)
                  elif isinstance(item, dict):
                      for v in item.values():
                          if isinstance(v, str) and v.endswith('.md'):
                              paths.append(v)
                          elif isinstance(v, list):
                              paths.extend(collect_paths(v))
              return paths

          doc_paths = collect_paths(nav)
          parts = []
          for rel in doc_paths:
              path = os.path.join('docs', rel)
              if not os.path.isfile(path):
                  continue
              with open(path) as f:
                  content = f.read().rstrip()
              parts.append(f'---\nSource: {rel}\n---\n\n{content}')

          with open('docs/llms-full.txt', 'w') as f:
              f.write('\n\n'.join(parts))
          print(f'Generated docs/llms-full.txt: {sum(len(p) for p in parts):,} chars, {len(parts)} sections')
          "

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy
