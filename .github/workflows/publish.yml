name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --tb=short -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Verify built version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl)
          echo "Tag version: $TAG"
          echo "Built wheel: $WHEEL"
          if [[ "$WHEEL" != *"$TAG"* ]]; then
            echo "ERROR: Wheel version does not match tag $TAG"
            exit 1
          fi

      - name: Verify FileActions API in built wheel
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              file_actions_source = archive.read("lamia/actions/file.py").decode()

          required_methods = ("read", "write", "append", "exists", "glob")
          missing = [
              method
              for method in required_methods
              if f"def {method}(" not in file_actions_source
          ]
          if missing:
              print(
                  "ERROR: Built wheel is missing FileActions methods:",
                  ", ".join(missing),
              )
              sys.exit(1)

          print("FileActions API verified in built wheel:", ", ".join(required_methods))
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
