site_name: Lamia Documentation
site_description: A comprehensive automation and validation framework for Python
site_url: https://lamia-lang.github.io/lamia/

repo_url: https://github.com/lamia-lang/lamia
repo_name: lamia-lang/lamia

theme:
  name: material
  logo: assets/lamia_logo.png
  favicon: assets/lamia_favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
    - content.code.annotate
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Writing scripts with Lamia: getting-started/index.md
  - User Guide:
    - .hu file Syntax: user-guide/hu-syntax.md
    - .lm file Syntax: user-guide/lm-syntax.md
    - File Operations: user-guide/file-operations.md
    - File Context: user-guide/files-context.md
    - Web Automation: user-guide/web-automation.md
    - Validation: user-guide/validation.md
    - Model Evaluation: user-guide/evaluation.md
    - Using Lamia in Python: user-guide/python-library.md
    - Custom LLM Adapters: user-guide/custom-llm-adapters.md
    - Pydantic Models Guide: user-guide/pydantic-models.md
    - Scheduling: user-guide/scheduling.md
    - Triggers: user-guide/triggers.md
  - Style Guides:
    - "LSG-1: .hu Files": style-guides/hu-style.md
    - "LSG-2: .lm Files": style-guides/lm-style.md
    - "LSG-3: Project Structure": style-guides/project-structure.md
  - Advanced:
    - Lamia Debugger: advanced/debugger.md
    - Inspect: advanced/inspect.md
    - Lamia Cloud: advanced/lamia-cloud.md
  - Reference:
    - Selector Usage Guide: validation/selector-usage-guide.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lamia-lang/lamia
  generator: false